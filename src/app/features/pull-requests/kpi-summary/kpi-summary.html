<section class="grid gap-4" aria-label="Indicadores">
  <dl class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
    @for (tile of tiles(); track tile.label) {
      <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
        <dt class="text-xs tracking-wide text-slate-400 uppercase">{{ tile.label }}</dt>
        <dd class="mt-1 text-3xl font-semibold tabular-nums {{ tile.classes }}">
          {{ tile.value }}
        </dd>
      </div>
    }
  </dl>

  @defer (on viewport) {
    <app-kpi-charts [pullRequests]="pullRequests()" />
  } @placeholder {
    <div class="h-80 rounded-xl border border-slate-800 bg-slate-900/60"></div>
  }
</section>
